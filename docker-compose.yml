# One command: cp .env.example .env && docker compose up --wait
# Then the API and UI are on http://localhost:8000 (API docs at /docs).
#
# db      Postgres 16: postings, jobs, labels, policy versions, LangGraph checkpoints
# api     FastAPI: creates the tables and inserts policy v1 at startup, then serves /v1, /ui and the UI
# worker  takes jobs and runs the agent; starts once the api is healthy (only the api creates tables)

x-app: &app
  build: .
  image: labeling-agent
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://labeler:labeler@db:5432/labeler
    # Loading a checkpoint may only build plain, safe types (our state is plain JSON), so a tampered
    # checkpoint can't make LangGraph import and run code. tests/db/test_checkpoints.py checks it.
    LANGGRAPH_STRICT_MSGPACK: "true"
    # From the shell or .env, so `LLM_BACKEND=fake docker compose up` runs with no model calls.
    LLM_BACKEND: ${LLM_BACKEND:-real}
    AGENT_CONFIG: ${AGENT_CONFIG:-}
    # The live demo's "Send real postings" button (app/demo.py). Set DEMO_MODE=false to hide it.
    DEMO_MODE: ${DEMO_MODE:-true}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}  # jobs at a time: a live-demo run of 30 takes about a minute

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: labeler
      POSTGRES_PASSWORD: labeler
      POSTGRES_DB: labeler
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeler -d labeler"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data:ro  # the dataset CSV and the splits, read by the live demo only
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 100s  # lets a running job finish (the job limit is 90 s)

volumes:
  db-data:
