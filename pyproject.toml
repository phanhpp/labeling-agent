[project]
name = "labeling-agent"
version = "0.1.0"
description = "Labels job postings against a versioned fraud policy, with evidence."
requires-python = ">=3.12,<3.13"
# Runtime packages only. Later phases add the model, LangGraph and web packages as they need them.
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "beautifulsoup4>=4.12",
    "langchain-anthropic>=1.7",
    "langgraph>=1.2",
    "langchain-core>=1.8.4",
    "langsmith>=0.15.1",
    "langchain-typesafe==0.0.1a3",
    "langgraph-checkpoint-postgres>=3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false  # an app, not a library: run with `uv run`, nothing to install

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# It writes RESULTS.md: long lines are sentences, kept whole so they read as written.
"eval/report.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and query parameters as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.require"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests import app and scripts from the repo root
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "e2e: calls real models; needs API keys (skipped without them)",
    "data: needs the dataset CSV in data/raw/ (run scripts/load_data.py first)",
]
